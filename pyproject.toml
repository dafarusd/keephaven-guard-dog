[project]
name = "keephaven-guard-dog"
version = "0.1.1"
description = "Find where a person shows up online, get them removed, and keep watch. Runs on your own machine."
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY.md"]
dependencies = ["scrapling[fetchers]==0.5"]

[project.optional-dependencies]
accounts = ["maigret==0.6.6"]

[project.scripts]
keephaven-guard-dog = "guard_dog.__main__:main"

[build-system]
requires = ["setuptools>=77"]  # the SPDX license string (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["guard_dog", "guard_dog.optouts"]

[tool.setuptools.package-data]
guard_dog = ["data/*.json", "data/*.txt"]
